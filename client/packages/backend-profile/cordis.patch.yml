- insert:
    - id: config-editor
      name: '@deepseek-ai/dsh-config-editor'

    - id: settings
      name: '@deepseek-ai/dsh-settings'

    - id: credentials
      name: '@deepseek-ai/dsh-credentials-local'
      config:
        path: !!js dshHomePath('edmore/.credentials.yaml')

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers: {}

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        reasoningEffort: low

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-persistence-jsonl
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('edmore/sessions')
        compression: none

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        modelPolicies:
          - provider: bonsai-local
            model: bonsai-2-27b
            thresholdRatio: 0.75
            headroomTokens: 16384
            retainTokens: 16384
            maxTokens: 4096
            maxOverflowRetries: 1

    - id: jobs
      name: '@deepseek-ai/dsh-jobs-local'

    - id: subprocess
      name: '@deepseek-ai/dsh-subprocess-local'

    - id: sandbox
      name: '@deepseek-ai/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write
        workspaceRoot: !!js process.env.EDMORE_WORKSPACE ?? process.cwd()

    - id: approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: never

    - id: shell-env
      name: '@deepseek-ai/dsh-shell-env'

    - id: bash-sandbox
      name: '@deepseek-ai/dsh-bash-sandbox'
      config:
        cwd: !!js process.env.EDMORE_WORKSPACE ?? process.cwd()

    - id: fs-sandbox
      name: '@deepseek-ai/dsh-fs-sandbox'
      config:
        cwd: !!js process.env.EDMORE_WORKSPACE ?? process.cwd()

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        maxParallelToolCalls: 1
        agents: []

    - id: tools
      name: '@deepseek-ai/dsh-tools'
      config:
        mode: native

    - id: fs-observation-policy
      name: '@deepseek-ai/dsh-fs-observation-policy'

    - id: tool-fs
      disabled: !!js process.env.EDMORE_AUTH_WORKER === '1'
      name: '@deepseek-ai/dsh-tool-fs'

    - id: tool-bash
      disabled: !!js process.env.EDMORE_AUTH_WORKER === '1'
      name: '@deepseek-ai/dsh-tool-bash'
      config:
        enableRunInBackground: false

    - id: skills
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        includeDefaultRoots: !!js process.env.EDMORE_AUTH_WORKER !== '1'
        customSkillDirs:
          - !!js process.env.EDMORE_CLIENT_ROOT + '/skills'
          - !!js dshHomePath('edmore/skills')

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    - id: computer-use
      disabled: !!js process.env.EDMORE_DISABLE_COMPUTER_USE === '1' || process.platform !== 'darwin'
      name: '@deepseek-ai/dsh-computer-use'

    - id: computer-use-cua-driver-mcp
      disabled: !!js process.env.EDMORE_DISABLE_COMPUTER_USE === '1' || process.platform !== 'darwin'
      name: '@deepseek-ai/dsh-experimental-computer-use-cua-driver-mcp'
      config:
        command: !!js process.env.EDMORE_CUA_DRIVER_PATH || (process.env.HOME + '/.local/bin/cua-driver')
        args: [mcp]

    - id: edmore-workspace
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-workspace
        module: '@deepseek-ai/dsh-edmore-workspace'
        options:
            storePath: !!js dshHomePath('edmore/workspace.json')
            defaultProjectName: SEM
            defaultProjectCwd: !!js process.env.EDMORE_WORKSPACE ?? process.cwd()

    - id: edmore-core
      name: '@deepseek-ai/dsh-edmore-core'
      config:
        eventLogPath: !!js dshHomePath('edmore/events.jsonl')
        runtime:
          llmProviderStorePath: !!js dshHomePath('edmore/llm-providers.json')
          agentRoleStorePath: !!js dshHomePath('edmore/agent-roles.json')
          assistantProvider: openai
          assistantModel: gpt-5-mini
          assistantReasoningEffort: low
          assistantMaxTokens: 2048
          assistantTimeoutMs: 60000

    - id: webserver
      disabled: !!js process.env.EDMORE_AUTH_WORKER === '1'
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: !!js process.env.EDMORE_CLIENT_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.EDMORE_CLIENT_PORT ?? 7380)
        compression: none

    - id: edmore-user-webserver
      disabled: !!js process.env.EDMORE_AUTH_WORKER !== '1'
      name: '@deepseek-ai/dsh-edmore-auth/worker-webserver'
      config:
        host: '127.0.0.1'
        port: 0
        compression: none

    - id: edmore-session-state
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-session-state
        module: '@deepseek-ai/dsh-edmore-session-state'
        options:
            root: !!js dshHomePath('edmore/session-state')

    - id: edmore-plan-judge
      disabled: !!js process.env.EDMORE_USER_PLAN_JUDGE === '0'
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-plan-judge
        module: '@deepseek-ai/dsh-edmore-plan-judge'
        options:
            skillsRoot: !!js process.env.EDMORE_CLIENT_ROOT + '/skills'
            statePath: !!js dshHomePath('edmore/plan-judge-state.json')
            autoRepairMaxAttempts: 2

    - id: edmore-jev-decisions
      disabled: false
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-jev-decisions
        module: '@deepseek-ai/dsh-edmore-jev-decisions'
        options:
            apiKeyRef: TYPESAFE_API_KEY
            timeoutMs: 2500
            minConfidence: 0.9
            minMargin: 0.2

    - id: edmore-session-state-api
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-session-state-api
        module: '@deepseek-ai/dsh-edmore-session-state-api'

    - id: edmore-mcp-bridge
      disabled: !!js process.env.EDMORE_DISABLE_NIONSWIFT === '1'
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-mcp-bridge
        module: '@deepseek-ai/dsh-edmore-mcp-bridge'
        options:
            baseUrl: !!js process.env.EDMORE_NIONSWIFT_BASE_URL ?? 'http://127.0.0.1:7300'
            pollMs: 3000

    - id: edmore-backend
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-backend
        module: '@deepseek-ai/dsh-edmore-backend'

    - id: edmore-webui
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-webui
        module: '@deepseek-ai/dsh-edmore-webui'
        options:
            path: /edmore

    - id: edmore-workspace-api
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-workspace-api
        module: '@deepseek-ai/dsh-edmore-workspace-api'

    - id: edmore-conversation-title
      disabled: !!js process.env.EDMORE_USER_CONVERSATION_TITLE === '0'
      name: '@deepseek-ai/dsh-edmore-optional-feature'
      config:
        id: edmore-conversation-title
        module: '@deepseek-ai/dsh-edmore-conversation-title'
        options:
            role: title_generator
            maxInputChars: 2400
            minAssistantChars: 20
