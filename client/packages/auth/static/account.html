<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account · EDMORE</title><link rel="stylesheet" href="/auth/style.css"><script src="/auth/ui.js" defer></script></head>
<body><header><a href="/edmore/">EDMORE</a><span id="identity"></span><button id="logout">Sign out</button></header><main id="account"><h1>Account</h1><p id="status" role="status"></p><section><h2>My plugins</h2><div id="plugins"></div></section><section id="jev" hidden><h2>Jev API</h2><p id="jev-state"></p><form id="jev-key"><label>TypeSafe API key<input name="apiKey" type="password" maxlength="4096" autocomplete="off" required></label><div class="actions"><button>Save key</button><button id="clear-jev" class="secondary" type="button">Remove key</button></div></form></section><section><h2>Change password</h2><form id="password"><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>Change password</button></form></section><section id="admin" hidden><h2>Users</h2><div class="table-wrap"><table><thead><tr><th>Username</th><th>Role</th><th>Status</th><th>Sessions</th><th>Actions</th></tr></thead><tbody id="users"></tbody></table></div><h3>Create user</h3><form id="create-user"><label>Username<input name="username" pattern="[a-zA-Z0-9_-]{1,32}" required autocomplete="off"></label><label>Initial password<input name="password" type="password" minlength="12" maxlength="256" required autocomplete="new-password"></label><label class="check"><input name="isAdmin" type="checkbox">Administrator</label><button>Create user</button></form></section></main></body></html>
