schema_version: 1
id: acquire_4d_stem
version: 1.5.0
steps:
  - id: start-preview
    title: Start BF preview
    purpose: Display the live BF image for selecting the acquisition region.
    tool: agent_sem.play_bf
    parameters: {}
    confirm: false
    confirmation: ''
    expected_output: BF Preview playback started.
    completion: {type: tool_success}
    on_success: next
    on_failure: pause
  - id: stabilize-preview
    title: Wait for preview stabilization
    purpose: Allow the live preview to settle before synchronizing pixel size.
    tool: agent_sem.wait
    parameters:
      seconds: {mode: fixed, value: 10, unit: s, description: Mandatory preview stabilization wait.}
    confirm: false
    confirmation: ''
    expected_output: The 10-second wait completes.
    completion: {type: tool_success}
    on_success: next
    on_failure: pause
  - id: synchronize-pixels
    title: Synchronize pixel size
    purpose: Copy the active image pixel size into the SEM control UI.
    tool: agent_sem.sync_pixel_size
    parameters: {}
    confirm: false
    confirmation: ''
    expected_output: Pixel size synchronization succeeds.
    completion: {type: tool_success}
    on_success: next
    on_failure: pause
  - id: confirm-roi
    title: Confirm the synchronized ROI
    purpose: Let the user inspect the scan geometry before stopping preview.
    tool: agent_sem.wait
    parameters:
      seconds: {mode: fixed, value: 1, unit: s, description: Wait after the ROI confirmation.}
    confirm: true
    confirmation: confirm_roi_selection_after_pixel_sync
    confirmation_required: true
    expected_output: User confirms the ROI and the one-second wait completes.
    completion: {type: tool_success}
    on_success: next
    on_failure: pause
  - id: stop-preview
    title: Stop BF preview
    purpose: Stop live detector playback before the acquisition.
    tool: agent_sem.stop_playing_detector
    parameters: {}
    confirm: false
    confirmation: ''
    expected_output: BF Preview playback stopped.
    completion: {type: tool_success}
    on_success: next
    on_failure: pause
  - id: settle-detector
    title: Wait after stopping preview
    purpose: Allow detector playback to stop completely before acquisition.
    tool: agent_sem.wait
    parameters:
      seconds: {mode: fixed, value: 10, unit: s, description: Mandatory post-preview wait.}
    confirm: false
    confirmation: ''
    expected_output: The 10-second wait completes.
    completion: {type: tool_success}
    on_success: next
    on_failure: pause
  - id: acquire-dataset
    title: Acquire the 4D-STEM dataset
    purpose: Acquire diffraction patterns on the selected scan grid using the current SEM UI values when arguments are omitted.
    tool: agent_sem.acquire_4d_stem
    parameters:
      defocus_A: {mode: tool_default, unit: angstrom, description: Optional defocus; resolve from the SEM UI when omitted.}
      dwell_time: {mode: tool_default, unit: microsecond, description: Optional dwell time; resolve from the SEM UI when omitted.}
      scan_points_x: {mode: tool_default, unit: pixels, description: X pixel count; alternatively provide scan_step_x_A.}
      scan_points_y: {mode: tool_default, unit: pixels, description: Y pixel count; alternatively provide scan_step_y_A.}
      scan_step_x_A: {mode: tool_default, unit: angstrom, description: X scan step; alternatively provide scan_points_x.}
      scan_step_y_A: {mode: tool_default, unit: angstrom, description: Y scan step; alternatively provide scan_points_y.}
    confirm: false
    confirmation: ''
    expected_output: Acquisition reports a saved data path or success message. Tool success does not independently validate dataset quality.
    completion: {type: tool_success}
    on_success: next
    on_failure: pause
    failure_guidance: If defocus, dwell or scan-grid values are missing, ask for manual values or offer recommend_4d_stem_parameters. Never retry acquisition automatically.
